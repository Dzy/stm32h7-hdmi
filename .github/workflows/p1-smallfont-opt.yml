name: P1 small font optimize

on:
  push:
    branches:
      - tnc155-tinyusb-cdc
    paths:
      - .github/workflows/p1-smallfont-opt.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: tnc155-tinyusb-cdc
      - name: Patch renderer
        run: python3 tools/p1_smallfont_patch.py
      - name: Commit renderer
        shell: bash
        run: |
          git config user.name Dzy
          git config user.email 3352717+Dzy@users.noreply.github.com
          git add Core/Src/tnc155_firmware.c
          git commit -m "Reuse canonical P1 small font with Y offsets"
          git push origin HEAD:tnc155-tinyusb-cdc
