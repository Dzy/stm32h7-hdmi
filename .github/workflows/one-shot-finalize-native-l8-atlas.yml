name: one-shot finalize native L8 atlas

on:
  push:
    paths:
      - '.github/workflows/one-shot-finalize-native-l8-atlas.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tnc155-tinyusb-cdc
          fetch-depth: 0
      - name: Finalize direct L8 atlas path
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Core/Src/tnc155_firmware.c')
          s = p.read_text()

          old = '''/* The P1 font is expanded once at boot into a byte-per-pixel L8 mask atlas\n   in AXI SRAM.  Modes 0..2 share the canonical mode-0 glyph bank and apply\n   only their measured vertical offsets when blitted; modes 3..7 each have\n   one bank.  Per-cell inverse/bright colours are then four 32-bit mask ops\n   per row instead of ROM lookup + bit expansion on every redraw. */'''
          new = '''/* The P1 font is expanded once at boot directly into a byte-per-pixel L8\n   atlas in AXI SRAM using the normal phosphor CLUT indices.  Modes 0..2\n   share the canonical mode-0 glyph bank and apply only their measured\n   vertical offsets when blitted; modes 3..7 each have one bank.  Normal\n   text is therefore four aligned 32-bit copies per glyph row; inverse and\n   bright attributes are derived with word-wide arithmetic, never bitmaps. */'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''                for (bit = 0u; bit < 8u; ++bit) {\n                    uint8_t mask = (bits & (0x80u >> bit)) != 0u ?\n                                   0xffu : 0x00u;\n                    dst[bit * 2u] = mask;\n                    dst[bit * 2u + 1u] = mask;\n                }'''
          new = '''                for (bit = 0u; bit < 8u; ++bit) {\n                    uint8_t pixel = (bits & (0x80u >> bit)) != 0u ?\n                                    TNC_L8_ON_NORMAL : TNC_L8_OFF_NORMAL;\n                    dst[bit * 2u] = pixel;\n                    dst[bit * 2u + 1u] = pixel;\n                }'''
          assert old in s
          s = s.replace(old, new, 1)

          start = s.index('static void blit_atlas_row(')
          end = s.index('\n}\n\nstatic uint16_t load_backing_word16', start) + 2
          old = s[start:end]
          new = '''static void blit_atlas_row(unsigned attr, const uint32_t *src,\n                           uint32_t *dst)\n{\n    unsigned i;\n\n    switch (attr & 3u) {\n    case 0u:\n        /* Dominant path: atlas bytes already are final L8 pixels. */\n        dst[0] = src[0];\n        dst[1] = src[1];\n        dst[2] = src[2];\n        dst[3] = src[3];\n        return;\n    case 1u:\n        for (i = 0u; i < 4u; ++i)\n            dst[i] = src[i] ^ 0xdfdfdfdfu;\n        return;\n    case 2u:\n        for (i = 0u; i < 4u; ++i) {\n            uint32_t on = src[i] & 0x01010101u;\n            dst[i] = 0x04040404u + on * 0x6du;\n        }\n        return;\n    default:\n        for (i = 0u; i < 4u; ++i) {\n            uint32_t on = src[i] & 0x01010101u;\n            dst[i] = 0x71717171u - on * 0x6du;\n        }\n        return;\n    }\n}'''
          s = s[:start] + new + s[end:]

          old = '''    if (!gdc->display_enabled)\n        goto done;\n    if (font == NULL || font->bytes == NULL || font->size < 0x4000u)\n        return false;\n    if (active_height > TNC_NATIVE_HEIGHT)'''
          new = '''    if (!gdc->display_enabled)\n        goto done;\n    if (active_height > TNC_NATIVE_HEIGHT)'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY
      - name: Commit final atlas path
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Core/Src/tnc155_firmware.c
          git commit -m 'Use direct L8 font atlas for TNC155 text'
          git push origin HEAD:tnc155-tinyusb-cdc
