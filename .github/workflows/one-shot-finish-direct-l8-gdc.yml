name: one-shot finish direct L8 GDC

on:
  push:
    paths:
      - '.github/workflows/one-shot-finish-direct-l8-gdc.yml'

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout board branch
        uses: actions/checkout@v4
        with:
          ref: tnc155-tinyusb-cdc
          fetch-depth: 0
      - name: Checkout emulator STM32 branch
        uses: actions/checkout@v4
        with:
          repository: Dzy/tnc155-emulator
          ref: stm32-portable-serial
          path: tnc155-emulator
      - name: Integrate direct L8 GDC backend
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Makefile.tnc155')
          s = p.read_text()
          old = 'Core/Src/tnc155_usb_cdc.c \\\nCore/Src/gpio.c \\\n'
          new = 'Core/Src/tnc155_usb_cdc.c \\\nCore/Src/tnc155_upd7220_l8.c \\\nCore/Src/gpio.c \\\n'
          assert old in s
          s = s.replace(old, new, 1)
          old = 'src/clp/clp_board.c \\\nsrc/clp/upd7220.c \\\nsrc/machine/machine.c \\\n'
          new = 'src/clp/clp_board.c \\\nsrc/machine/machine.c \\\n'
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('Core/Src/tnc155_firmware.c')
          s = p.read_text()
          old = '''    if (redraw_tnc) {\n        if (s_native_full_redraw != 0u && !render_tnc_native()) {\n            g_tnc155_faulted = 1u;\n            return false;\n        }\n        /* Normal text/graphics writes have already updated the AXI L8 image\n           incrementally.  Publish its dirty cache lines to DMA2D once per\n           presented frame; mapping/mode changes take the full rebuild above. */\n        SCB_CleanDCache_by_Addr((uint32_t *)(void *)s_native_frame,\n                                (int32_t)TNC_NATIVE_BYTES);\n        __DSB();\n        dma_ok = dma2d_copy_tnc(TNC_NATIVE_ADDRESS,\n                                framebuffer_tnc_address(back_fb), false);\n    } else {'''
          new = '''    if (redraw_tnc) {\n        /* The STM32 uPD7220 backend now executes WDAT/FIGD/GCHRD and text\n           glyph blits directly into this native L8 framebuffer.  There is\n           no GDC backing-store rebuild or scanout stage in the runtime path. */\n        SCB_CleanDCache_by_Addr((uint32_t *)(void *)s_native_frame,\n                                (int32_t)TNC_NATIVE_BYTES);\n        __DSB();\n        dma_ok = dma2d_copy_tnc(TNC_NATIVE_ADDRESS,\n                                framebuffer_tnc_address(back_fb), false);\n    } else {'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''    s_native_full_redraw = 1u;\n    tnc155_upd7220_set_native_video_callbacks(\n        &s_machine->clp.gdc, native_l8_word_written,\n        native_l8_invalidate, NULL);'''
          new = '''    s_native_full_redraw = 0u;\n    tnc155_upd7220_bind_l8(&s_machine->clp.gdc,\n                           s_native_frame,\n                           TNC_NATIVE_WIDTH,\n                           TNC_NATIVE_HEIGHT,\n                           TNC_NATIVE_WIDTH,\n                           s_font_atlas);'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Build STM32H7 firmware
        run: make -f Makefile.tnc155 -j2 TNC155_DIR=tnc155-emulator
      - name: Commit functional integration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Makefile.tnc155 Core/Src/tnc155_firmware.c Core/Src/tnc155_upd7220_l8.c
          git commit -m 'Run STM32 uPD7220 directly on native L8 surface'
          git push origin HEAD:tnc155-tinyusb-cdc
