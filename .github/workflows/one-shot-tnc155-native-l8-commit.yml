name: one-shot TNC155 native L8 commit

on:
  push:
    paths:
      - '.github/workflows/one-shot-tnc155-native-l8-commit.yml'

permissions:
  contents: write

jobs:
  patch-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tnc155-tinyusb-cdc
          fetch-depth: 0
      - name: Apply native L8 patch from reviewed one-shot script
        shell: bash
        run: |
          python3 - <<'EXTRACT'
          from pathlib import Path
          src = Path('.github/workflows/one-shot-tnc155-native-l8.yml').read_text()
          marker = "          python3 - <<'PY'\n"
          start = src.index(marker) + len(marker)
          end = src.index("\n          PY", start)
          block = src[start:end]
          lines = []
          for line in block.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          Path('/tmp/native_l8_patch.py').write_text('\n'.join(lines) + '\n')
          EXTRACT
          python3 /tmp/native_l8_patch.py
      - name: Commit functional patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Core/Src/tnc155_firmware.c
          git commit -m 'Render uPD7220 directly to native L8 cache'
          git push origin HEAD:tnc155-tinyusb-cdc
