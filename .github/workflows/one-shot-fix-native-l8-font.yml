name: one-shot fix native L8 font atlas init

on:
  push:
    paths:
      - '.github/workflows/one-shot-fix-native-l8-font.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tnc155-tinyusb-cdc
          fetch-depth: 0
      - name: Fix atlas font binding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('Core/Src/tnc155_firmware.c')
          s = p.read_text()
          old = '''static bool init_raster_luts(void)\n{\n    unsigned bank;'''
          new = '''static bool init_raster_luts(void)\n{\n    const tnc155_rom_view *font = tnc155_rom_get(TNC155_ROM_P1);\n    unsigned bank;'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''static bool render_tnc_native(void)\n{\n    const tnc155_upd7220 *gdc = &s_machine->clp.gdc;\n    const tnc155_rom_view *font = tnc155_rom_get(TNC155_ROM_P1);\n    unsigned active_height'''
          new = '''static bool render_tnc_native(void)\n{\n    const tnc155_upd7220 *gdc = &s_machine->clp.gdc;\n    unsigned active_height'''
          assert old in s
          s = s.replace(old, new, 1)
          old = '''    unsigned row;\n    unsigned pattern;\n\n\n    for (bank'''
          new = '''    unsigned row;\n    unsigned pattern;\n\n    if (font == NULL || font->bytes == NULL || font->size < 0x4000u)\n        return false;\n\n    for (bank'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Core/Src/tnc155_firmware.c
          git commit -m 'Fix native L8 font atlas initialization'
          git push origin HEAD:tnc155-tinyusb-cdc
