name: Verify TMS9995 interrupt fix

on:
  push:
    branches: [stm32-performance]
    paths:
      - .github/workflows/verify-tms9995-interrupt-fix.yml

permissions:
  contents: write

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update INT4 edge test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/test_tms9995.c')
          s = p.read_text()
          old = '''    assert(cpu.decrementer_value == 2u);
              assert((cpu.pending_interrupts & 0x08u) != 0u);
              cpu.pending_interrupts = 0u;
              cpu.flags = 3u;
              tms9995_set_interrupt_line(&cpu, TMS9995_INTERRUPT_LEVEL4, true);
              assert(cpu.decrementer_value == 1u);
              assert((cpu.pending_interrupts & 0x08u) == 0u);
          '''
          new = '''    assert(cpu.decrementer_value == 2u);
              assert((cpu.pending_interrupts & 0x08u) != 0u);
              tms9995_set_interrupt_line(&cpu, TMS9995_INTERRUPT_LEVEL4, false);
              cpu.pending_interrupts = 0u;
              cpu.flags = 3u;
              tms9995_set_interrupt_line(&cpu, TMS9995_INTERRUPT_LEVEL4, true);
              assert(cpu.decrementer_value == 1u);
              assert((cpu.pending_interrupts & 0x08u) == 0u);
              tms9995_set_interrupt_line(&cpu, TMS9995_INTERRUPT_LEVEL4, false);
          '''
          assert old in s, 'INT4 test source did not match'
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
      - name: Install host build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Commit tested test update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_tms9995.c
          git commit -m "Update TMS9995 INT4 edge semantics test"
          git push origin HEAD:stm32-performance

  stm32h7-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout emulator performance branch
        uses: actions/checkout@v4
        with:
          ref: stm32-performance
          path: tnc155-emulator
      - name: Checkout STM32 HDMI integration branch
        uses: actions/checkout@v4
        with:
          repository: Dzy/stm32h7-hdmi
          ref: tnc155-tinyusb-cdc
          path: stm32h7-hdmi
      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - name: Build STM32H7 firmware
        working-directory: stm32h7-hdmi
        run: make -f Makefile.tnc155 -j2 TNC155_DIR=../tnc155-emulator
